<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90EE90;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyGrad)"/>
  
  <!-- Park ground -->
  <rect y="280" width="600" height="120" fill="#228B22"/>
  
  <!-- Grass patches -->
  <circle cx="100" cy="300" r="25" fill="#1d5c1d"/>
  <circle cx="500" cy="320" r="30" fill="#1d5c1d"/>
  
  <!-- Broken bench 1 -->
  <rect x="120" y="240" width="120" height="12" fill="#8B4513" stroke="#333" stroke-width="2" transform="rotate(-20 180 246)"/>
  <rect x="140" y="250" width="8" height="50" fill="#8B4513"/>
  <rect x="212" y="250" width="8" height="50" fill="#8B4513"/>
  
  <!-- Cracked effect -->
  <line x1="160" y1="240" x2="165" y2="235" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="235" x2="175" y2="230" stroke="#333" stroke-width="2"/>
  
  <!-- Broken bench 2 -->
  <rect x="340" y="250" width="120" height="12" fill="#8B4513" stroke="#333" stroke-width="2" transform="rotate(15 400 256)"/>
  <rect x="355" y="260" width="8" height="45" fill="#8B4513"/>
  <rect x="430" y="260" width="8" height="45" fill="#8B4513"/>
  
  <!-- Missing part -->
  <line x1="400" y1="250" x2="420" y2="245" stroke="#333" stroke-width="3"/>
  
  <!-- Warning tape on benches -->
  <line x1="100" y1="245" x2="240" y2="255" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
  
  <!-- Person showing concern -->
  <circle cx="300" cy="180" r="12" fill="#333"/>
  <rect x="288" y="195" width="24" height="35" fill="#333"/>
  <line x1="288" y1="210" x2="270" y2="240" stroke="#333" stroke-width="3"/>
  <line x1="312" y1="210" x2="330" y2="240" stroke="#333" stroke-width="3"/>
  
  <!-- Danger sign -->
  <rect x="450" y="120" width="70" height="100" fill="#FFD700" stroke="#FF0000" stroke-width="3"/>
  <text x="485" y="180" font-size="56" font-weight="bold" fill="#FF0000" text-anchor="middle">!</text>
  
  <!-- Title -->
  <text x="300" y="30" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">Damaged Park Benches</text>
</svg>
