<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyGrad)"/>
  <rect y="280" width="600" height="120" fill="#228B22"/>
  
  <!-- Street light pole -->
  <rect x="280" y="100" width="40" height="200" fill="#666"/>
  
  <!-- Broken light fixture -->
  <circle cx="300" cy="80" r="30" fill="#999"/>
  <circle cx="300" cy="80" r="20" fill="#333"/>
  
  <!-- Cracks on light -->
  <line x1="290" y1="60" x2="285" y2="50" stroke="#333" stroke-width="2"/>
  <line x1="310" y1="70" x2="320" y2="60" stroke="#333" stroke-width="2"/>
  <line x1="295" y1="90" x2="285" y2="100" stroke="#333" stroke-width="2"/>
  
  <!-- Dark area below (no light) -->
  <rect x="100" y="300" width="400" height="80" fill="#1a1a1a" opacity="0.6"/>
  
  <!-- Person silhouette looking unsafe -->
  <circle cx="200" cy="250" r="15" fill="#333"/>
  <rect x="185" y="270" width="30" height="40" fill="#333"/>
  <rect x="175" y="270" width="15" height="30" fill="#333"/>
  <rect x="200" y="270" width="15" height="30" fill="#333"/>
  
  <!-- Warning sign -->
  <rect x="420" y="200" width="60" height="80" fill="#FFD700" stroke="#FF0000" stroke-width="3"/>
  <text x="450" y="250" font-size="32" font-weight="bold" fill="#FF0000" text-anchor="middle">!</text>
  
  <!-- Title -->
  <text x="300" y="30" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">Broken Street Light</text>
</svg>
