# Render Blueprint — Backend (Node/Express/MongoDB) + Frontend (React/Vite)
# Repo: https://github.com/Swapnil1298/Community-Cleanliness-Issues

services:
  # ─── BACKEND: Node.js + Express + MongoDB + JWT ───
  - type: web
    name: community-cleanliness-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: community-cleanliness-web
          type: web
          property: host

  # ─── FRONTEND: React + Vite + Tailwind ───
  - type: web
    name: community-cleanliness-web
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_URL
        fromService:
          name: community-cleanliness-api
          type: web
          property: host
        transform: https://${host}/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
