# Render Blueprint — Unified: Express serves API + built React/Vite frontend
# Repo: https://github.com/Swapnil1298/Community-Cleanliness-Issues

services:
  # ─── SINGLE SERVICE: Express serves API + built React frontend ───
  - type: web
    name: community-cleanliness-app
    runtime: node
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_SAMPLE_ISSUES
        value: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: VITE_API_URL
        value: /api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
